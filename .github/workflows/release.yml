name: Release

# A push to main with a new programVersion in version.lua makes the release v<version> with the
# archive the installer downloads. A release published by hand on GitHub gets its archive too
on:
  push:
    branches: [main]
    paths:
      - version.lua
      - .github/workflows/release.yml
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}

    - name: Read the version
      id: version
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        version=$(grep -o 'programVersion = "[^"]*"' version.lua | cut -d'"' -f2)
        tag="v$version"

        if [ "${{ github.event_name }}" = "release" ] && [ "${{ github.event.release.tag_name }}" != "$tag" ]; then
          echo "version.lua says $version, but the tag is ${{ github.event.release.tag_name }}"
          exit 1
        fi

        echo "tag=$tag" >> "$GITHUB_OUTPUT"

        # A push only makes a release for a version that has none yet
        if [ "${{ github.event_name }}" = "push" ] && gh release view "$tag" > /dev/null 2>&1; then
          echo "skip=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Create tar archive
      if: steps.version.outputs.skip != 'true'
      run: |
        tar -cf files.tar --exclude-from=.tarignore *
        tar -tf files.tar | grep -v '/$' > waterline.files
        echo waterline.files >> waterline.files
        rm files.tar
        tar -cvf WaterLineControl.tar --exclude-from=.tarignore *

    - name: Create the release
      if: steps.version.outputs.skip != 'true' && github.event_name == 'push'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release create "${{ steps.version.outputs.tag }}" --target "${{ github.sha }}" --title "${{ steps.version.outputs.tag }}" --notes "Version ${{ steps.version.outputs.tag }}"

    - name: Attach the archive
      if: steps.version.outputs.skip != 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release upload "${{ steps.version.outputs.tag }}" WaterLineControl.tar --clobber
